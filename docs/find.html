<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f23">
  <title>Birol Hotel — Find your booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,700&display=swap">
  <link rel="stylesheet" href="styles/stars.css?v=5">
  <link rel="stylesheet" href="styles/booking.css?v=5">
  <link rel="stylesheet" href="styles/find.css?v=5">
</head>
<body>
  <div class="stars" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <main class="page">

    <header class="page-header">
      <a href="index.html" class="back-link" aria-label="Back to home">‹</a>
      <div class="monogram">B</div>
      <div class="page-title">
        <h1>Find your booking</h1>
        <p class="muted">Enter your reference number</p>
      </div>
    </header>

    <section class="find-card">
      <form id="findForm" autocomplete="off">
        <label class="field">
          <span class="field-label">Booking reference</span>
          <div class="field-input">
            <span class="prefix" aria-hidden="true">BH-</span>
            <input id="refInput"
                   type="text"
                   inputmode="latin"
                   maxlength="11"
                   autocapitalize="characters"
                   spellcheck="false"
                   placeholder="A1B2C3D4"
                   autofocus
                   required>
          </div>
        </label>
        <button type="submit" class="btn-primary">Find booking</button>
        <p id="findError" class="find-error" role="alert"></p>
      </form>

      <p class="hint">
        Your reference looks like <code>BH-A1B2C3D4</code> and was sent to you
        right after booking. It's case-insensitive.
      </p>
    </section>

    <!-- Result area: a single card or an empty state -->
    <section id="result" class="booking-list" aria-live="polite"></section>

  </main>

  <script src="js/bot.js?v=5"></script>
  <script src="js/find.js?v=5"></script>
</body>
</html>
